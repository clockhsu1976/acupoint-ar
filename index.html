<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穴位快找</title>
<meta name="theme-color" content="#101418">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #101418; --panel: #1a2027; --text: #e8edf2; --dim: #93a1af;
    --accent: #4fc3a1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 16px; gap: 12px;
  }
  h1 { font-size: 1.1rem; font-weight: 600; }
  h1 small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  #stage {
    position: relative; width: min(92vw, 860px); aspect-ratio: 4/3;
    background: #000; border-radius: 12px; overflow: hidden;
  }
  /* 手機直拿：舞台放大到接近全螢幕，鏡頭畫面才夠大 */
  @media (orientation: portrait) and (max-width: 700px) {
    body { padding: 8px; gap: 8px; }
    #stage { width: 96vw; height: 74vh; aspect-ratio: auto; }
  }
  #video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
  }
  #video.mirrored { transform: scaleX(-1); }   /* 只有前鏡頭要鏡像 */
  #video.hidden { display: none; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #status {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px;
    background: rgba(0,0,0,.55); font-size: .85rem; color: var(--dim);
  }
  #parts {
    display: flex; gap: 6px; width: min(92vw, 860px);
    background: var(--panel); border-radius: 10px; padding: 4px;
  }
  #parts .part {
    flex: 1; background: none; border: none; color: var(--dim);
    border-radius: 8px; padding: 9px 0; font-size: .92rem; cursor: pointer;
    font-family: inherit;
  }
  #parts .part.active { background: #2c3540; color: var(--text); font-weight: 600; }
  #symptoms {
    display: flex; gap: 8px; width: min(92vw, 860px);
    overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch;
  }
  #symptoms .chip {
    flex: 0 0 auto; background: var(--panel); color: var(--dim);
    border: 1px solid #2c3540; border-radius: 999px; padding: 7px 14px;
    font-size: .85rem; cursor: pointer; white-space: nowrap;
  }
  #symptoms .chip.active {
    background: var(--accent); color: #08211a; border-color: var(--accent); font-weight: 600;
  }
  #controls {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    width: min(92vw, 860px); font-size: .82rem; color: var(--dim);
  }
  #controls label { user-select: none; cursor: pointer; }
  #controls button {
    background: var(--panel); color: var(--text); border: 1px solid #2c3540;
    border-radius: 8px; padding: 6px 12px; font-size: .82rem; cursor: pointer;
  }
  #controls button:hover { border-color: var(--accent); }
  #legend {
    display: flex; flex-wrap: wrap; gap: 10px; width: min(92vw, 860px);
  }
  .pt {
    background: var(--panel); border-radius: 10px; padding: 10px 14px;
    flex: 1 1 240px; font-size: .88rem; line-height: 1.5;

  .dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 6px; vertical-align: baseline;
  }
  .pt .ind { color: var(--dim); }
  .note { color: var(--dim); font-size: .78rem; width: min(92vw, 860px); line-height: 1.6; }
</style>
</head>
<body>
<h1>穴位快找<small id="subtitle">手部穴位・依症狀取穴</small></h1>

<div id="parts">
  <button class="part active" data-part="hand">✋ 手部</button>
  <button class="part" data-part="foot">🦶 足部</button>
</div>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="status">載入模型中…</div>
</div>

<div id="controls">
  <button id="btnLive">📷 即時鏡頭</button>

<p class="note">
  ⚠ 免責聲明：本工具為衛教與保健按摩參考，並非醫療器材，不提供診斷或治療建議。穴位定位以影像估算，僅適用於按壓保健，絕不可作為針灸進針依據。手部誤差約 1–2 公分；<b>足部因偵測關鍵點稀少，僅能標示概略範圍（虛線圈），請務必對照文字定位自行確認</b>。孕婦按壓合谷等穴位前請先諮詢中醫師；症狀持續或加劇請儘速就醫。影像僅在您的裝置上即時處理，不會上傳或儲存。
</p>

<script type="module">

// ---- 資料層：穴位定位公式（機器可讀，正式版抽成 JSON DB）----
// 手部關鍵點索引：0 腕、2 拇指掌指、5 食指掌指、9 中指掌指
const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
// 以「腕→中指掌指」反向外推：2寸 ≈ 掌長(腕至中指掌指) × 0.55
const forearm2cun = lm => {
  const dx = lm[0].x - lm[9].x, dy = lm[0].y - lm[9].y;
  return { x: lm[0].x + dx * 0.55, y: lm[0].y + dy * 0.55 };
};
const mid = (a, b) => lerp(a, b, 0.5);
// side: 穴位所在面（palm 掌側 / dorsum 背側），與當前手面不符就不顯示
// 關鍵點索引：0腕 1拇CMC 2拇MCP 3拇IP 4拇尖 5食MCP 7食DIP 8食尖 9中MCP 13無名MCP 17小MCP
const ACUPOINTS = [
  // ---- 背側 ----
  {
    id: "LI4", name: "合谷", color: "#ff6b6b", side: "dorsum",
    ind: "頭痛、牙痛、感冒、面口諸症",
    loc: "手背第一、二掌骨間，第二掌骨橈側中點",
    calc: lm => { const m = lerp(lm[2], lm[5], 0.5); return lerp(m, lm[0], 0.15); }
  },
  {
    id: "TE5", name: "外關", color: "#7aa2ff", side: "dorsum",
    ind: "頭痛、耳鳴、感冒發熱、手腕痛",
    loc: "腕背橫紋上 2 寸，尺橈兩骨之間（與內關相對）",
    calc: forearm2cun
  },
  {
    id: "TE4", name: "陽池", color: "#c792ea", side: "dorsum",
    ind: "手腕痛、目赤腫痛、口乾",
    loc: "腕背橫紋中，指總伸肌腱尺側凹陷處",
    calc: lm => lerp(lm[0], lm[13], 0.10)
  },
  {
    id: "LI5", name: "陽谿", color: "#f78c6c", side: "dorsum",
    ind: "手腕痛、頭痛、目赤腫痛",
    loc: "腕背橫紋橈側，拇短伸肌腱與拇長伸肌腱之間凹陷（鼻煙窩）",
    calc: lm => lerp(lm[0], lm[1], 0.45)
  },
  {
    id: "TE3", name: "中渚", color: "#82aaff", side: "dorsum",
    ind: "偏頭痛、耳鳴耳聾、肩背痛",
    loc: "手背第四、五掌骨間，掌指關節後方凹陷處",
    calc: lm => lerp(mid(lm[13], lm[17]), lm[0], 0.30)
  },
  {
    id: "SI3", name: "後谿", color: "#89ddff", side: "dorsum",
    ind: "落枕、頭項強痛、腰背痛",
    loc: "第五掌骨小頭後方尺側，握拳掌橫紋頭處",
    calc: lm => lerp(lm[17], lm[0], 0.18)
  },
  {
    id: "EX-UE8", name: "外勞宮", color: "#ffcb6b", side: "dorsum",
    ind: "落枕、頸項強痛、手背腫痛",
    loc: "手背第二、三掌骨間，掌指關節後約 0.5 寸（落枕穴）",
    calc: lm => lerp(mid(lm[5], lm[9]), lm[0], 0.15)
  },
  {
    id: "LI1", name: "商陽", color: "#ff9e80", side: "dorsum",

  },

    ind: "咽喉腫痛、咳嗽、昏厥急救",
    loc: "拇指末節橈側，指甲角旁約 0.1 寸",
    calc: lm => lerp(lm[3], lm[4], 0.8)
  },
  // ---- 掌側 ----
  {
    id: "PC8", name: "勞宮", color: "#ffd166", side: "palm",
    ind: "心悸、心煩、口瘡、掌心熱",
    loc: "掌心，第二、三掌骨之間，握拳中指尖處",
    calc: lm => lerp(lm[0], lm[9], 0.70)
  },
  {
    id: "PC6", name: "內關", color: "#4fc3a1", side: "palm",
    ind: "噁心嘔吐、暈車、心悸、失眠",
    loc: "腕橫紋上 2 寸，掌長肌腱與橈側腕屈肌腱之間",
    calc: forearm2cun
  },
  {
    id: "PC7", name: "大陵", color: "#c3e88d", side: "palm",

  },
  {
    id: "HT7", name: "神門", color: "#b2ccd6", side: "palm",

    loc: "腕掌橫紋尺側端，尺側腕屈肌腱橈側凹陷處",
    calc: lm => lerp(lm[0], lm[17], 0.18)
  },
  {
    id: "LU9", name: "太淵", color: "#80cbc4", side: "palm",
    ind: "咳嗽、氣喘、手腕痛",
    loc: "腕掌橫紋橈側端，橈動脈搏動處",
    calc: lm => lerp(lm[0], lm[1], 0.35)
  },
  {
    id: "LU10", name: "魚際", color: "#e57373", side: "palm",
    ind: "咳嗽、咽乾、失音",
    loc: "第一掌骨中點橈側，赤白肉際處",
    calc: lm => mid(lm[1], lm[2])
  },
  {
    id: "HT8", name: "少府", color: "#ba68c8", side: "palm",
    ind: "心悸、胸痛、掌心熱",
    loc: "掌心第四、五掌骨之間，握拳小指尖處",
    calc: lm => lerp(lm[0], mid(lm[13], lm[17]), 0.70)
  }
];

// ---- 足部座標系：以 heel→toe 為長軸、法向量指向內側，穴位用比例定位 ----
// Pose 關鍵點：25/26 膝、27/28 踝、29/30 跟、31/32 趾（每腳僅 3 點，故用比例框架而非逐點插值）
const FOOT_IDX = {
  left:  { knee: 25, ankle: 27, heel: 29, toe: 31 },
  right: { knee: 26, ankle: 28, heel: 30, toe: 32 }
};
const MEDIAL_SIGN = 1;   // 內側法向量方向，待真人照片實測校準

// 實測（2026-08-27，使用者坐姿照）：MediaPipe 的 foot_index 落在「腳背中段」而非腳趾、
// heel 落在踝下方而非腳跟後端。因此不能拿 heel→toe 當腳長，改以「踝→foot_index」為單位
// 向量，需要更前面的位置就外推（d > 1）。
function footFrame(pose, sideKey) {
  const i = FOOT_IDX[sideKey];
  const ankle = pose[i.ankle], heel = pose[i.heel], toe = pose[i.toe], knee = pose[i.knee];
  const fx = toe.x - ankle.x, fy = toe.y - ankle.y;
  const len = Math.hypot(fx, fy) || 1e-6;
  const ux = fx / len, uy = fy / len;                        // 單位向量（踝→腳背中段）
  const s = (sideKey === "left" ? 1 : -1) * MEDIAL_SIGN;
  const nx = -uy * s, ny = ux * s;                           // 單位法向量（指向內側，實測方向正確）
  return {
    ankle, heel, toe, knee, len,
    // 足部：d = 沿踝→趾方向的倍數（0=踝、1=foot_index、>1 往腳趾外推），m = 法向偏移（正=內側）
    fwd: (d, m = 0) => ({ x: ankle.x + ux * len * d + nx * len * m,
                          y: ankle.y + uy * len * d + ny * len * m }),
    // 小腿：踝→膝方向 d（1=膝），法向 m
    up: (d, m = 0) => ({ x: ankle.x + (knee.x - ankle.x) * d + nx * len * m,
                         y: ankle.y + (knee.y - ankle.y) * d + ny * len * m })
  };
}

// 足部穴位。係數為骨度分寸換算的估計值，精度低於手部（每腳僅 3 個關鍵點）
const FOOTPOINTS = [
  { id: "LR3", name: "太衝", color: "#ff6b6b",
    ind: "頭痛、眩暈、目赤、情緒煩躁、經痛",
    loc: "足背第一、二蹠骨結合部前方凹陷處",
    calc: f => f.fwd(1.05, 0.06) },
  { id: "ST41", name: "解谿", color: "#ffd166",
    ind: "踝關節痛、足下垂、頭痛、腹脹",
    loc: "足背踝關節橫紋中央，兩肌腱之間",
    calc: f => f.fwd(0.32, 0) },
  { id: "ST44", name: "內庭", color: "#f78c6c",
    ind: "牙痛、咽喉腫痛、胃熱、腹脹",
    loc: "足背第二、三趾間，趾蹼緣後方赤白肉際",
    calc: f => f.fwd(1.50, 0.02) },
  { id: "GB40", name: "丘墟", color: "#82aaff",
    ind: "踝扭傷、脅痛、目赤",
    loc: "外踝前下方，趾長伸肌腱外側凹陷處",
    calc: f => f.fwd(0.28, -0.28) },
  { id: "BL60", name: "崑崙", color: "#89ddff",
    ind: "頭痛項強、腰背痛、踝關節痛",
    loc: "外踝尖與跟腱之間凹陷處",
    calc: f => f.fwd(0.08, -0.30) },
  { id: "KI3", name: "太谿", color: "#4fc3a1",
    ind: "耳鳴、失眠、腰痛、咽乾",
    loc: "內踝尖與跟腱之間凹陷處",
    calc: f => f.fwd(0.08, 0.30) },
  { id: "SP6", name: "三陰交", color: "#c3e88d",
    ind: "婦科諸症、失眠、消化不良（孕婦禁按）",
    loc: "內踝尖上 3 寸，脛骨內側緣後方",
    needsKnee: true,
    calc: f => f.up(0.18, 0.16) },
  { id: "ST36", name: "足三里", color: "#c792ea",
    ind: "胃痛、消化不良、疲勞、增強體力",
    loc: "犢鼻下 3 寸，脛骨前緣外一橫指",
    // 犢鼻(髕骨下緣)比 pose 的膝關節中心低約 1 寸，故從膝往下取 4/16 而非 3/16
    needsKnee: true,
    calc: f => f.up(0.75, -0.16) }
];

// ---- 掌背面判別：腕→食指根 × 腕→小指根 的外積符號，配合左右手 ----
// 慣例校準：以使用者左手手背照實測（flipLabel 見校準紀錄）
const PALM_RULE = { flipLabel: false };
function handSide(lm, label) {
  const v1x = lm[5].x - lm[0].x, v1y = lm[5].y - lm[0].y;
  const v2x = lm[17].x - lm[0].x, v2y = lm[17].y - lm[0].y;
  const cross = v1x * v2y - v1y * v2x;
  const norm = Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y) || 1;
  const s = cross / norm;                       // ≈ sin(兩向量夾角)，帶符號
  if (Math.abs(s) < 0.12) return { name: null, uncertain: true, s, label };
  let isRight = label === "Right";
  if (PALM_RULE.flipLabel) isRight = !isRight;
  const palm = isRight ? s < 0 : s > 0;
  return { name: palm ? "palm" : "dorsum", uncertain: false, s, label };
}
const SIDE_ZH = { palm: "掌面", dorsum: "手背面" };

// ---- 症狀 → 穴位（先選症狀，只標對應穴位）----
// ids 跨部位（手 + 腳），顯示時依當前部位過濾
const SYMPTOMS = [
  { key: "headache", name: "頭痛", ids: ["LI4", "TE5", "TE3", "LI5", "LR3", "BL60"] },
  { key: "insomnia", name: "失眠", ids: ["HT7", "PC7", "PC6", "KI3", "SP6"] },
  { key: "nausea", name: "噁心暈車", ids: ["PC6", "ST36"] },
  { key: "palpitation", name: "心悸", ids: ["PC6", "HT7", "PC8", "HT8"] },
  { key: "stiffneck", name: "落枕頸痛", ids: ["EX-UE8", "SI3", "BL60"] },
  { key: "sorethroat", name: "咽喉痛", ids: ["LU11", "LI1", "LU10", "ST44"] },
  { key: "cough", name: "咳嗽", ids: ["LU9", "LU10", "LU11"] },
  { key: "stomach", name: "胃痛消化", ids: ["PC6", "ST36", "ST44"] },
  { key: "fatigue", name: "疲勞", ids: ["ST36", "LI4"] },
  { key: "period", name: "經痛婦科", ids: ["SP6", "LR3"] },
  { key: "wristpain", name: "手腕痛", ids: ["TE4", "LI5", "TE5", "LU9", "PC7"] },
  { key: "anklepain", name: "腳踝痛", ids: ["GB40", "ST41", "BL60", "KI3"] },
  { key: "tinnitus", name: "耳鳴", ids: ["TE3", "TE5", "KI3"] },
  { key: "toothache", name: "牙痛", ids: ["LI4", "ST44"] },
  { key: "cold", name: "感冒", ids: ["LI4", "TE5", "LI1"] },
  { key: "all", name: "全部穴位", ids: null }
];

let PART = "hand";          // "hand" | "foot"
const POINT_SETS = { hand: () => ACUPOINTS, foot: () => FOOTPOINTS };
const PART_ZH = { hand: "手部", foot: "足部" };
let activeSymptom = null;   // 預設未選：先選症狀才標點

function pointsFor(part) {
  if (!activeSymptom) return [];
  const s = SYMPTOMS.find(s => s.key === activeSymptom);
  if (!s) return [];
  const pool = POINT_SETS[part]();
  return s.ids === null ? pool : pool.filter(p => s.ids.includes(p.id));
}
function getActivePoints() { return pointsFor(PART); }
function otherPart() { return PART === "hand" ? "foot" : "hand"; }

// 骨架連線（除錯顯示用）
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const skeletonToggle = document.getElementById("showSkeleton");
const fileInput = document.getElementById("fileInput");

function renderLegend() {
  const pool = getActivePoints();
  const other = pointsFor(otherPart());
  let html = pool.length
    ? pool.map(p =>
      `<div class="pt"><b><span class="dot" style="background:${p.color}"></span>${p.name} ${p.id}</b>
       <span class="ind">${p.side ? `（${p.side === "palm" ? "掌側" : "背側"}）` : ""}</span><br>
       <span class="ind">主治：${p.ind}<br>定位：${p.loc}</span></div>`).join("")
    : `<div class="pt"><span class="ind">${activeSymptom
        ? `${PART_ZH[PART]}沒有對應這個症狀的穴位`
        : "選擇上方症狀後，這裡會列出對應穴位與說明"}</span></div>`;
  // 跨部位提示：同一症狀常常手腳都有穴
  if (other.length) {
    html += `<div class="pt"><span class="ind">${PART_ZH[otherPart()]}也有：${
      other.map(p => p.name).join("、")}（點上方切換）</span></div>`;
  }
  document.getElementById("legend").innerHTML = html;
}

function renderChips() {
  document.getElementById("symptoms").innerHTML = SYMPTOMS.map(s =>
    `<button class="chip${s.key === activeSymptom ? " active" : ""}" data-key="${s.key}">${s.name}</button>`).join("");
}
document.getElementById("symptoms").addEventListener("click", e => {
  const key = e.target.dataset?.key;
  if (!key) return;
  activeSymptom = activeSymptom === key ? null : key;   // 再點一次取消
  renderChips();
  renderLegend();
  if (mode === "photo" && photoImg) detectPhoto(photoImg);
});
document.getElementById("parts").addEventListener("click", async e => {
  const part = e.target.dataset?.part;
  if (!part || part === PART) return;
  PART = part;
  document.querySelectorAll("#parts .part")
    .forEach(b => b.classList.toggle("active", b.dataset.part === part));
  document.getElementById("subtitle").textContent = `${PART_ZH[part]}穴位・依症狀取穴`;
  renderLegend();
  smoothState.clear();
  try {
    if (part === "foot") await loadPose();
    if (mode === "live" && rafId) await activeDetector().setOptions({ runningMode: "VIDEO" });
    else if (mode === "photo" && photoImg) await detectPhoto(photoImg);
    else statusEl.textContent = `${PART_ZH[part]}模式就緒：選好症狀後按「即時鏡頭」或「上傳照片測試」`;
  } catch (err) {
    statusEl.textContent = "切換部位失敗：" + err.message;
    console.error(err);
  }
});

renderChips();
renderLegend();

// ---- 對位層：平滑濾波（指數移動平均，抑制關鍵點抖動）----
const smoothState = new Map();
// maxJump：單幀位移超過此距離視為偵測雜訊（關鍵點跳到另一條腿），大幅降低跟隨速度
function smooth(key, pt, alpha = 0.4, maxJump = Infinity) {
  const prev = smoothState.get(key);
  if (!prev) { smoothState.set(key, pt); return pt; }
  const jumped = Math.hypot(pt.x - prev.x, pt.y - prev.y) > maxJump;
  const a = jumped ? alpha * 0.2 : alpha;
  const next = { x: prev.x + (pt.x - prev.x) * a, y: prev.y + (pt.y - prev.y) * a };
  smoothState.set(key, next);
  return next;
}

let handLandmarker = null;
let lastResult = null;
let mode = null;            // "live" | "photo"
let photoImg = null;
let stream = null;
let rafId = null;

let poseLandmarker = null;
let visionFileset = null;

async function getVision() {
  if (!visionFileset) {
    visionFileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  }
  return visionFileset;
}

async function loadModel() {
  const vision = await getVision();
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
  });
  statusEl.textContent = "模型就緒。選擇「即時鏡頭」或「上傳照片測試」";
}

// 足部模型較大，切到足部才載。用 promise 快取避免並行呼叫建出兩個模型
let posePromise = null;
function loadPose() {
  if (poseLandmarker) return Promise.resolve(poseLandmarker);
  if (!posePromise) posePromise = createPose().catch(err => { posePromise = null; throw err; });
  return posePromise;
}

async function createPose() {
  statusEl.textContent = "載入足部模型中…（約 10MB，第一次較久）";
  const vision = await getVision();
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      // 用 full 不用 lite：實測 lite 對「無頭部的下半身照」完全偵測不到，full 可信度 0.97
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numPoses: 1,
    // 閾值放寬：下半身入鏡（無頭）時偵測分數本來就低，0.5 會整個偵測不到
    minPoseDetectionConfidence: 0.25,
    minPosePresenceConfidence: 0.25,
    minTrackingConfidence: 0.25
  });
  return poseLandmarker;
}

// 目前部位對應的偵測器（切換模式時兩個模型都要同步 runningMode）
function activeDetector() { return PART === "foot" ? poseLandmarker : handLandmarker; }

function fitCanvas() {
  if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
}

// 來源(寬高)貼進畫布的座標換算；live 用 cover+鏡像，photo 用 contain 不鏡像
function makeMapper(srcW, srcH, fit, mirror) {
  const cw = canvas.width, ch = canvas.height;
  const scale = fit === "cover" ? Math.max(cw / srcW, ch / srcH) : Math.min(cw / srcW, ch / srcH);
  const offX = (cw - srcW * scale) / 2, offY = (ch - srcH * scale) / 2;
  return pt => ({
    x: mirror ? cw - (pt.x * srcW * scale + offX) : pt.x * srcW * scale + offX,
    y: pt.y * srcH * scale + offY
  });
}

// ---- 標籤防碰撞：量測實際大小，八方向由近而遠找空位，找不到才退回近處 ----
const hits = (a, b) => !(a.x2 < b.x1 || a.x1 > b.x2 || a.y2 < b.y1 || a.y1 > b.y2);
const LABEL_DIRS = [[1, 0], [-1, 0], [0, -1], [0, 1], [0.8, -0.8], [-0.8, -0.8], [0.8, 0.8], [-0.8, 0.8]];

function labelFont(fontPx) {
  return `600 ${fontPx}px -apple-system, "PingFang TC", sans-serif`;
}

function placeLabel(text, anchor, r, fontPx, boxes) {
  ctx.font = labelFont(fontPx);
  const bw = ctx.measureText(text).width + fontPx * 0.8;
  const bh = fontPx * 1.56;
  const gap = r + fontPx * 0.45;
  let fallback = null;
  for (const dist of [gap, gap + fontPx * 1.6, gap + fontPx * 3.2]) {
    for (const [dx, dy] of LABEL_DIRS) {
      const cx = anchor.x + dx * (dist + bw / 2), cy = anchor.y + dy * (dist + bh / 2);
      const box = { x1: cx - bw / 2, y1: cy - bh / 2, x2: cx + bw / 2, y2: cy + bh / 2 };
      if (box.x1 < 3 || box.y1 < 3 || box.x2 > canvas.width - 3 || box.y2 > canvas.height - 3) continue;
      if (boxes.some(b => hits(box, b))) { fallback = fallback || { cx, cy, bw, bh, box }; continue; }
      return { cx, cy, bw, bh, box };
    }
  }
  // 完全找不到空位：擺在右側近處，至少不會消失
  return fallback || (() => {
    const cx = anchor.x + gap + bw / 2, cy = anchor.y;
    return { cx, cy, bw, bh, box: { x1: cx - bw / 2, y1: cy - bh / 2, x2: cx + bw / 2, y2: cy + bh / 2 } };
  })();
}

function drawLabel(text, anchor, pl, color, fontPx) {
  // 引線：標籤被推遠時仍看得出對應哪個點
  ctx.beginPath();
  ctx.moveTo(anchor.x, anchor.y); ctx.lineTo(pl.cx, pl.cy);
  ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 1.5; ctx.stroke();
  // 底板：深底提高對比，邊框用穴位色連結點與標籤
  const rad = pl.bh * 0.35;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(pl.box.x1, pl.box.y1, pl.bw, pl.bh, rad);
  else ctx.rect(pl.box.x1, pl.box.y1, pl.bw, pl.bh);
  ctx.fillStyle = "rgba(8, 12, 15, 0.78)"; ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
  // 文字
  ctx.font = labelFont(fontPx);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff"; ctx.fillText(text, pl.cx, pl.cy);
  ctx.textAlign = "left";
}

function drawPoint(pos, color, r) {
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
  ctx.fillStyle = color + "dd"; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
}

// 足部關鍵點只有 3 個、精度本就低，畫成「概略區域」而非精確點，視覺上不過度承諾
function drawZone(pos, color, r) {
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
  ctx.fillStyle = color + "44"; ctx.fill();
  ctx.setLineDash([5, 4]); ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, Math.max(2, r * 0.22), 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
}

function drawHands(result, toCanvas, useSmoothing) {
  const hands = result?.landmarks ?? [];
  if (!hands.length) { smoothState.clear(); return { drawn: 0, notes: [] }; }
  let drawn = 0;
  const notes = [];
  const boxes = [];   // 已占用的標籤區域，跨雙手共用

  hands.forEach((lm, hi) => {
    // 信心閘門：手偵測分數不足就整隻不標，寧可不標不標錯
    const hd = result.handednesses?.[hi]?.[0];
    const score = hd?.score ?? 0;
    if (score < 0.8) return;
    drawn++;
    const side = handSide(lm, hd?.categoryName ?? hd?.displayName);

    if (skeletonToggle.checked) {
      ctx.strokeStyle = "rgba(255,255,255,0.3)";
      ctx.lineWidth = 2;
      for (const [a, b] of BONES) {
        const p1 = toCanvas(lm[a]), p2 = toCanvas(lm[b]);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
    }

    // 以掌長決定標記尺寸，遠近一致
    const w = toCanvas(lm[0]), m = toCanvas(lm[9]);
    const palmPx = Math.hypot(m.x - w.x, m.y - w.y);
    const r = Math.max(5, palmPx * 0.07);
    const fontPx = Math.max(13, palmPx * 0.14);

    // 手太小＝離鏡頭太遠，關鍵點誤差放大，提示靠近
    if (palmPx < canvas.height * 0.10) notes.push("手離鏡頭有點遠，靠近一點會更準");

    // 未選症狀不標點（症狀優先流程）
    const pool = getActivePoints();
    if (!pool.length) {
      notes.push("請先在上方選擇症狀");
      return;
    }

    // 依當前手面過濾穴位；角度太側判不出面向時整手不標（寧可不標不標錯）
    if (side.uncertain) {
      notes.push("角度太側判不出掌背面，請把掌心或手背正對鏡頭");
      return;
    }
    const visible = pool.filter(p => p.side === side.name);
    const hidden = pool.filter(p => p.side !== side.name);
    if (!visible.length) {
      notes.push(`${SIDE_ZH[side.name]}——這個症狀的穴位在另一面，請翻手（${hidden.map(p => p.name).join("、")}）`);
      return;
    }
    notes.push(hidden.length
      ? `${SIDE_ZH[side.name]}，翻手可見：${hidden.map(p => p.name).join("、")}`
      : SIDE_ZH[side.name]);

    // 腕旁標示目前判定的手面（也占位，避免穴位標籤壓上來）
    const sidePx = fontPx * 0.8;
    ctx.font = labelFont(sidePx);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    const sideText = SIDE_ZH[side.name];
    const sx = w.x + 10, sy = w.y + fontPx;
    const sw = ctx.measureText(sideText).width;
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.strokeText(sideText, sx, sy);
    ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fillText(sideText, sx, sy);
    boxes.push({ x1: sx, y1: sy - sidePx * 0.8, x2: sx + sw, y2: sy + sidePx * 0.8 });

    // 兩階段：先為所有標籤找不重疊的位置，再依「引線→標籤→穴位點」順序畫，點在最上層
    const labelPx = Math.max(12, palmPx * 0.105);
    const items = visible.map(p => {
      const raw = toCanvas(p.calc(lm));
      return { p, pos: useSmoothing ? smooth(`${hi}-${p.id}`, raw) : raw };
    });
    for (const it of items) {
      it.place = placeLabel(it.p.name, it.pos, r, labelPx, boxes);
      boxes.push(it.place.box);
    }
    for (const it of items) drawLabel(it.p.name, it.pos, it.place, it.p.color, labelPx);
    for (const it of items) drawPoint(it.pos, it.p.color, r);
  });
  return { drawn, notes };
}

// ---- 足部繪製：每腳僅 3 個關鍵點，改用「跟→趾長軸 + 內外側法向」比例框架 ----
const FOOT_ZH = { left: "左腳", right: "右腳" };
const LEG_BONES = [[25, 27], [26, 28], [27, 29], [28, 30], [29, 31], [30, 32], [27, 31], [28, 32]];

function drawFeet(result, toCanvas, useSmoothing) {
  const poses = result?.landmarks ?? [];
  if (!poses.length) { smoothState.clear(); return { drawn: 0, notes: [] }; }
  const notes = [];
  const boxes = [];
  let drawn = 0;
  const pool = getActivePoints();

  poses.forEach((pose, pi) => {
    // 在畫布像素空間建座標系：正規化座標的 x/y 尺度不同，法向量會失真
    const px = pose.map(toCanvas);

    // 一次只標「最可信的那隻腳」。雙腿同框時 pose 常把左右腳估到同一條腿上（實測：
    // 兩組穴位上下排在同一條小腿），距離檢查抓不到這種失效；而按摩本來就一次按一隻腳，
    // 少標一隻的代價遠低於標錯腿。
    const vis = k => pose[k]?.visibility ?? 0;
    const footScore = s => Math.min(vis(FOOT_IDX[s].ankle), vis(FOOT_IDX[s].heel), vis(FOOT_IDX[s].toe));
    const best = ["left", "right"]
      .map(s => ({ s, v: footScore(s) }))
      .filter(x => x.v >= 0.6)
      .sort((a, b) => b.v - a.v)[0];
    const sides = best ? [best.s] : [];

    for (const sideKey of sides) {
      const i = FOOT_IDX[sideKey];
      drawn++;
      if (!pool.length) continue;

      const f = footFrame(px, sideKey);
      if (!(f.len > 12)) continue;                    // 腳太小，插值誤差過大
      const r = Math.max(5, f.len * 0.11);
      const labelPx = Math.max(12, f.len * 0.16);

      // 小腿穴位要膝蓋入鏡才算得出骨度
      const hasKnee = vis(i.knee) >= 0.5;
      const visible = pool.filter(p => hasKnee || !p.needsKnee);
      const needKnee = pool.filter(p => p.needsKnee && !hasKnee);
      if (needKnee.length) {
        notes.push(`膝蓋未入鏡，${needKnee.map(p => p.name).join("、")}無法定位（請讓小腿到腳一起入鏡）`);
      }
      if (!visible.length) continue;

      if (skeletonToggle.checked) {
        ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 2;
        for (const [a, b] of LEG_BONES) {
          if (vis(a) < 0.5 || vis(b) < 0.5) continue;
          ctx.beginPath(); ctx.moveTo(px[a].x, px[a].y); ctx.lineTo(px[b].x, px[b].y); ctx.stroke();
        }
      }

      // 不標「左腳/右腳」：單腳顯示下使用者自己知道拍的是哪隻，而模型搞混左右時
      // 這個標籤反而給出錯誤資訊

      const items = visible.map(p => {
        const raw = p.calc(f);
        // 足部關鍵點抖動遠大於手部：平滑更重，且抑制跨腿的大跳動。
        // 鍵值不含 sideKey——單腳顯示下模型的左右判定會搖擺，鍵跟著換會讓平滑重置
        return { p, pos: useSmoothing
          ? smooth(`${pi}-foot-${p.id}`, raw, 0.22, f.len * 0.4) : raw };
      });
      for (const it of items) {
        it.place = placeLabel(it.p.name, it.pos, r, labelPx, boxes);
        boxes.push(it.place.box);
      }
      for (const it of items) drawLabel(it.p.name, it.pos, it.place, it.p.color, labelPx);
      for (const it of items) drawZone(it.pos, it.p.color, r);
    }
  });

  if (drawn && !pool.length) notes.push("請先在上方選擇症狀");
  if (drawn) notes.push("虛線圈為概略範圍（足部精度低於手部），請對照下方文字定位確認");
  return { drawn, notes };
}

// ---- 引導輪廓：沒偵測到手時顯示，導引使用者把部位放進畫面 ----
let guidePhase = 0;
function drawGuide() {
  const cw = canvas.width, ch = canvas.height;
  if (!cw || !ch) return;
  guidePhase += 0.05;
  const pulse = 0.16 + 0.08 * Math.sin(guidePhase);   // 緩慢呼吸感
  ctx.save();

  // 虛線引導框：同時受寬高限制，直式/橫式舞台都不爆框
  const rw = Math.min(cw * 0.78, ch * 0.6);
  const rh = Math.min(ch * 0.84, rw * 1.4);
  const rx = (cw - rw) / 2, ry = (ch - rh) * 0.35;
  ctx.setLineDash([12, 9]);
  ctx.lineWidth = 3;
  ctx.strokeStyle = `rgba(79, 195, 161, ${pulse + 0.3})`;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(rx, ry, rw, rh, 26); else ctx.rect(rx, ry, rw, rh);
  ctx.stroke();
  ctx.setLineDash([]);

  // 半透明手形輪廓（系統手形符號當剪影）
  ctx.globalAlpha = pulse;
  ctx.font = `${Math.round(Math.min(rh * 0.62, rw * 0.9))}px -apple-system, "Apple Color Emoji", sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(PART === "foot" ? "🦵" : "🖐", cw / 2, ry + rh * 0.46);
  ctx.globalAlpha = 1;

  // 提示文字
  const fs = Math.max(14, Math.min(ch * 0.034, rw * 0.075));
  ctx.font = `600 ${fs}px -apple-system, "PingFang TC", sans-serif`;
  const hint = PART === "foot"
    ? "坐著拍，一次一隻腳，連大腿一起入鏡"
    : "把手放進框內，掌心或手背正對鏡頭";
  const hx = cw / 2, hy = ry + rh - fs * 1.2;   // 框內底部，避免壓到狀態列
  ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.strokeText(hint, hx, hy);
  ctx.fillStyle = "rgba(255,255,255,0.95)"; ctx.fillText(hint, hx, hy);

  ctx.restore();
}

// ---- 即時鏡頭模式 ----
// 預設後鏡頭（照自己的手或幫別人照）；facingMode 非強制，桌機只有一顆鏡頭也能開
let facing = "environment";
let mirrorLive = false;      // 前鏡頭才鏡像顯示
async function startLive() {
  if (PART === "foot") await loadPose();
  if (!activeDetector()) return;
  stopAll();
  mode = "live";
  video.classList.remove("hidden");
  try {
    await activeDetector().setOptions({ runningMode: "VIDEO" });
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 960 } }
    });
    // 以實際拿到的鏡頭為準決定是否鏡像（要求後鏡頭但裝置只有前鏡頭時仍正確）
    const actual = stream.getVideoTracks()[0]?.getSettings()?.facingMode;
    mirrorLive = (actual ?? facing) === "user";
    video.classList.toggle("mirrored", mirrorLive);
    video.srcObject = stream;
    video.addEventListener("loadeddata", () => {
      statusEl.textContent = PART === "foot"
        ? "請讓小腿到腳一起入鏡" : "請把手掌或手背舉到鏡頭前";
      rafId = requestAnimationFrame(liveLoop);
    }, { once: true });
  } catch (err) {
    statusEl.textContent = "鏡頭啟動失敗：" + err.message + "（此裝置可能沒有攝影機，可改用「上傳照片測試」）";
    console.error(err);
  }
}

let lastVideoTime = -1;
function liveLoop() {
  if (mode !== "live") return;
  fitCanvas();
  if (video.currentTime !== lastVideoTime && video.videoWidth) {
    lastVideoTime = video.currentTime;
    const det = activeDetector();
    if (!det) { rafId = requestAnimationFrame(liveLoop); return; }
    const result = det.detectForVideo(video, performance.now());
    lastResult = result;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const map = makeMapper(video.videoWidth, video.videoHeight, "cover", mirrorLive);
    const res = PART === "foot" ? drawFeet(result, map, true) : drawHands(result, map, true);
    if (res.drawn) {
      const unit = PART === "foot" ? "隻腳" : "隻手";
      statusEl.textContent = `偵測到 ${res.drawn} ${unit} · ${res.notes.join("；")}`;
    } else {
      drawGuide();
      statusEl.textContent = PART === "foot"
        ? "偵測不到腳：請坐著拍、一次一隻腳，並讓大腿或身體一起入鏡（模型靠軀幹定位）"
        : "請把手放進畫面中的引導框";
    }
  }
  rafId = requestAnimationFrame(liveLoop);
}

// ---- 照片模式 ----
async function detectPhoto(img) {
  stopAll();
  mode = "photo";
  photoImg = img;
  video.classList.add("hidden");
  fitCanvas();
  if (!canvas.width || !canvas.height) {
    // layout 尚未完成時稍候再試；不能只等 rAF（背景分頁不會觸發）
    await new Promise(r => { requestAnimationFrame(r); setTimeout(r, 120); });
    fitCanvas();
    if (!canvas.width || !canvas.height) {         // 仍拿不到就用容器實際大小
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.round(rect.width) || 860);
      canvas.height = Math.max(1, Math.round(rect.height) || 645);
    }
  }
  if (PART === "foot") await loadPose();
  const det = activeDetector();
  await det.setOptions({ runningMode: "IMAGE" });
  const result = det.detect(img);
  lastResult = result;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const map = makeMapper(img.naturalWidth, img.naturalHeight, "contain", false);
  const o = map({ x: 0, y: 0 }), s = map({ x: 1, y: 1 });
  ctx.drawImage(img, o.x, o.y, s.x - o.x, s.y - o.y);
  const res = PART === "foot" ? drawFeet(result, map, false) : drawHands(result, map, false);
  const unit = PART === "foot" ? "隻腳" : "隻手";
  statusEl.textContent = res.drawn
    ? `照片中偵測到 ${res.drawn} ${unit} · ${res.notes.join("；")}`
    : (PART === "foot"
        ? "照片中沒有偵測到腳。腳的偵測需要看到部分身體（模型靠軀幹定位），試試拍到大腿或坐姿全身"
        : "照片中沒有偵測到手，換一張試試（手要清楚、光線足）");
}

function stopAll() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  smoothState.clear();
  lastVideoTime = -1;
}

document.getElementById("btnLive").addEventListener("click", startLive);
document.getElementById("btnFlip").addEventListener("click", () => {
  facing = facing === "environment" ? "user" : "environment";
  if (mode === "live" || !mode) startLive();
});
document.getElementById("btnPhoto").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  const f = fileInput.files?.[0];
  fileInput.value = "";                     // 允許重選同一個檔案
  if (!f) return;
  statusEl.textContent = `讀取照片中…（${f.name}）`;
  const img = new Image();
  img.onload = () => detectPhoto(img).catch(err => {
    statusEl.textContent = "偵測失敗：" + err.message;
    console.error(err);
  });
  img.onerror = () => {
    const isHeic = /\.hei[cf]$/i.test(f.name) || /hei[cf]/i.test(f.type);
    statusEl.textContent = isHeic
      ? "這是 HEIC 格式，瀏覽器無法解碼。請改用 JPEG/PNG（iPhone 可在「設定→相機→格式」選「最相容」，或分享時選存為 JPEG）"
      : `照片讀取失敗（${f.name}，${f.type || "未知格式"}），請換 JPEG 或 PNG 試試`;
  };
  img.src = URL.createObjectURL(f);
});
skeletonToggle.addEventListener("change", () => { if (mode === "photo" && photoImg) detectPhoto(photoImg); });
// 開發測試掛鉤，只在 ?debug 時暴露
if (new URLSearchParams(location.search).has("debug")) {
  window.__debug = { detectPhoto, getMode: () => mode, last: () => lastResult, handSide, drawGuide, fitCanvas,
                     pose: () => poseLandmarker, loadPose, footFrame, FOOTPOINTS };
}

// PWA：可加入主畫面、模型快取供離線使用
// debug 模式（開發用）反過來註銷 SW，否則快取會讓改版看不到效果
if ("serviceWorker" in navigator) {
  const dev = new URLSearchParams(location.search).has("debug");
  if (dev) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  } else if (location.protocol === "https:" || location.hostname === "localhost") {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
}

loadModel()
  .then(() => startLive())   // 預設先試鏡頭，失敗會提示改用照片
  .catch(err => {
    statusEl.textContent = "模型載入失敗：" + err.message;
    console.error(err);
  });
</script>
